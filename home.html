<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦘 袋鼠数学</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #030712;
  --text: #f8fafc;
  --muted: #64748b;
  --muted2: #94a3b8;
  --purple: #8b5cf6;
  --blue: #3b82f6;
  --emerald: #10b981;
  --amber: #f59e0b;
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ── Aurora ── */
.aurora {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.ab {
  position: absolute; border-radius: 50%;
  filter: blur(120px); opacity: 0.1;
  animation: drift 18s ease-in-out infinite;
}
.ab1 { width: 700px; height: 700px; background: #7c3aed; top: -300px; left: -150px; animation-delay: 0s; }
.ab2 { width: 600px; height: 600px; background: #2563eb; bottom: -200px; right: -150px; animation-delay: -7s; }
.ab3 { width: 500px; height: 500px; background: #0891b2; top: 40%; left: 50%; animation-delay: -13s; }
@keyframes drift {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(20px,-30px); }
  66% { transform: translate(-20px,20px); }
}

/* ── Layout ── */
.page {
  position: relative; z-index: 1;
  max-width: 900px; margin: 0 auto;
  padding: 48px 24px 80px;
  display: flex; flex-direction: column;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  text-align: center;
  margin-bottom: 56px;
}
.logo-icon { font-size: 48px; display: block; margin-bottom: 12px; }
.logo-title {
  font-size: 28px; font-weight: 900; letter-spacing: -0.03em;
  background: linear-gradient(135deg, #a78bfa, #60a5fa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.logo-sub {
  font-size: 14px; color: var(--muted2); margin-top: 6px;
}

/* ── Big Cards ── */
.cards { display: flex; flex-direction: row; gap: 24px; flex: 1; align-items: stretch; }

.big-card {
  display: flex; flex-direction: column;
  align-items: flex-start;
  text-decoration: none; color: inherit;
  border-radius: 24px;
  padding: 36px 32px;
  flex: 1;
  min-height: 200px;
  position: relative; overflow: hidden;
  transition: transform .25s ease, box-shadow .25s ease;
}
.big-card:hover { transform: translateY(-4px); }

/* 袋鼠数学卡片 */
.card-kangroo {
  background: linear-gradient(135deg, rgba(139,92,246,.18) 0%, rgba(59,130,246,.12) 100%);
  border: 1px solid rgba(139,92,246,.3);
  box-shadow: 0 0 40px rgba(139,92,246,.08);
}
.card-kangroo:hover {
  border-color: rgba(139,92,246,.55);
  box-shadow: 0 8px 48px rgba(139,92,246,.18);
}

/* 今日作业卡片 */
.card-hw {
  background: linear-gradient(135deg, rgba(245,158,11,.12) 0%, rgba(236,72,153,.08) 100%);
  border: 1px solid rgba(245,158,11,.25);
  box-shadow: 0 0 40px rgba(245,158,11,.06);
}
.card-hw:hover {
  border-color: rgba(245,158,11,.5);
  box-shadow: 0 8px 48px rgba(245,158,11,.14);
}

/* Card content */
.card-emoji {
  font-size: 44px; margin-bottom: 16px; line-height: 1;
  display: block;
}
.card-title {
  font-size: 26px; font-weight: 800; letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.card-desc {
  font-size: 14px; color: var(--muted2); line-height: 1.6;
  flex: 1;
}
.card-arrow {
  margin-top: 24px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600;
  padding: 8px 18px;
  border-radius: 20px;
  transition: opacity .2s;
}
.card-kangroo .card-arrow {
  background: rgba(139,92,246,.2);
  color: #c4b5fd;
  border: 1px solid rgba(139,92,246,.25);
}
.card-hw .card-arrow {
  background: rgba(245,158,11,.15);
  color: #fcd34d;
  border: 1px solid rgba(245,158,11,.2);
}
.big-card:hover .card-arrow { opacity: .8; }

/* Decorative circle */
.card-deco {
  position: absolute; right: -40px; bottom: -40px;
  width: 160px; height: 160px; border-radius: 50%;
  opacity: 0.06;
}
.card-kangroo .card-deco { background: #8b5cf6; }
.card-hw .card-deco { background: #f59e0b; }

/* ── Date ── */
.date-footer {
  text-align: center;
  margin-top: 40px;
  font-size: 12px; color: var(--muted);
}

/* ── Animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: none; }
}
.anim { animation: fadeUp .5s ease both; }
.d1 { animation-delay: .05s; }
.d2 { animation-delay: .15s; }
.d3 { animation-delay: .25s; }

/* ── Responsive Mobile/Tablet ── */
@media (max-width: 768px) {
  .page { max-width: 600px; }
  .cards { flex-direction: column; }
}
@media (max-width: 480px) {
  .page { padding: 36px 16px 60px; }
  .header { margin-bottom: 40px; }
  .logo-icon { font-size: 40px; }
  .logo-title { font-size: 24px; }
  .big-card { padding: 28px 24px; min-height: 170px; }
  .card-emoji { font-size: 36px; }
  .card-title { font-size: 22px; }
}
</style>
</head>
<body>

<div class="aurora">
  <div class="ab ab1"></div>
  <div class="ab ab2"></div>
  <div class="ab ab3"></div>
</div>

<div class="page">

  <div class="header anim d1">
    <span class="logo-icon">🦘</span>
    <div class="logo-title">袋鼠数学</div>
    <div class="logo-sub">每天进步一点点</div>
  </div>

  <div class="cards">

    <a href="https://yuankunfightinghub.github.io/kangroo-math/index.html"
       class="big-card card-kangroo anim d2">
      <span class="card-emoji">🦘</span>
      <div class="card-title">袋鼠数学</div>
      <div class="card-desc">系统课程 · 模块学习<br>计数 · 逻辑 · 几何 · 应用题</div>
      <div class="card-arrow">进入课程 →</div>
      <div class="card-deco"></div>
    </a>

    <a href="homework.html" class="big-card card-hw anim d3">
      <span class="card-emoji">📋</span>
      <div class="card-title">今日作业</div>
      <div class="card-desc">查看当天任务 · 打卡完成情况<br>跟踪每日学习进度</div>
      <div class="card-arrow">查看作业 →</div>
      <div class="card-deco"></div>
    </a>

  </div>

  <div class="date-footer anim d3" id="dateBadge"></div>

</div>

<script>
(function() {
  const d = new Date();
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('dateBadge').textContent =
    `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日  ${days[d.getDay()]}`;
})();
</script>
</body>
</html>
