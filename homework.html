<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 今日作业</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #030712;
  color: #f8fafc;
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  min-height: 100vh;
}

.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ab { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.08; animation: drift 18s ease-in-out infinite; }
.ab1 { width: 600px; height: 600px; background: #f59e0b; top: -200px; right: -100px; }
.ab2 { width: 500px; height: 500px; background: #ec4899; bottom: -150px; left: -100px; animation-delay: -9s; }
@keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(20px,-20px); } }

.page { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 40px 20px 80px; }

.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: #94a3b8; text-decoration: none;
  padding: 6px 12px 6px 8px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.03);
  margin-bottom: 32px; transition: color .2s, border-color .2s;
}
.back-btn:hover { color: #f8fafc; border-color: rgba(255,255,255,.15); }

.page-title { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 6px; }
.page-date { font-size: 13px; color: #64748b; margin-bottom: 36px; }

/* ── 日期区块 ── */
.hw-day { margin-bottom: 32px; }

.hw-day-title {
  font-size: 12px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: #64748b;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.hw-day-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, rgba(255,255,255,.07), transparent);
}

/* ── 作业条目 ── */
.hw-item {
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 10px;
  display: flex; align-items: flex-start; gap: 14px;
}

.item-icon { font-size: 22px; flex-shrink: 0; padding-top: 2px; }

.item-body { flex: 1; min-width: 0; }

.item-name {
  font-size: 14px; font-weight: 600; color: #cbd5e1;
  margin-bottom: 12px; word-break: break-all;
}

/* 音频 */
.hw-audio audio {
  width: 100%; height: 40px;
  border-radius: 8px;
  accent-color: #f59e0b;
}

/* 图片 */
.hw-image img {
  width: 100%; border-radius: 10px;
  display: block;
}

/* 视频 */
.hw-video video {
  width: 100%; border-radius: 10px;
  display: block;
  background: #000;
}

/* PPT */
.open-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(245,158,11,.12);
  border: 1px solid rgba(245,158,11,.25);
  color: #fcd34d;
  text-decoration: none;
  font-size: 14px; font-weight: 600;
  padding: 10px 20px; border-radius: 10px;
  transition: background .2s, border-color .2s;
}
.open-btn:hover { background: rgba(245,158,11,.2); border-color: rgba(245,158,11,.45); }
.open-btn::before { content: '📊'; }

/* 空状态 */
.hw-empty {
  text-align: center; padding: 60px 24px;
  color: #475569; font-size: 14px;
}
.hw-empty .icon { font-size: 40px; margin-bottom: 12px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.anim { animation: fadeUp .45s ease both; }
.d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; } .d3 { animation-delay: .25s; }

@media (max-width: 480px) {
  .page { padding: 28px 16px 60px; }
  .hw-item { padding: 14px 16px; }
}
</style>
</head>
<body>

<div class="aurora">
  <div class="ab ab1"></div>
  <div class="ab ab2"></div>
</div>

<div class="page">

  <a href="home.html" class="back-btn anim d1">← 返回首页</a>

  <div class="page-title anim d2">📋 今日作业</div>
  <div class="page-date anim d2" id="pageDate"></div>

  <div id="hw-content" class="anim d3">

    <!-- ═══════════════════════════════════
         skill homework-insert 会在此处插入内容
         格式示例：
         <div class="hw-day" data-date="2026-03-19">
           <div class="hw-day-title">2026-03-19 周三</div>
           <div class="hw-item hw-audio"> ... </div>
         </div>
    ════════════════════════════════════ -->

    <div class="hw-day" data-date="2026-03-19">
      <div class="hw-day-title">2026-03-19 周三</div>
      <div class="hw-item hw-audio">
        <div class="item-icon">🎵</div>
        <div class="item-body">
          <div class="item-name">HWB P11 Reading Polar Bears</div>
          <audio controls src="src/assets/hwb-p11-polar-bears.mp3" preload="metadata"></audio>
        </div>
      </div>
      <div class="hw-item hw-image">
        <div class="item-icon">🖼️</div>
        <div class="item-body">
          <div class="item-name">袋鼠数学 Level 5-6 Day 20-21</div>
          <img src="src/assets/b59a178f-2b96-428e-92ce-df19915a3ae6.jpg" alt="袋鼠数学 Level 5-6 Day 20-21" loading="lazy">
        </div>
      </div>
    </div>

  </div>

</div>

<script>
(function() {
  const d = new Date();
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('pageDate').textContent =
    `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日  ${days[d.getDay()]}`;
})();
</script>
</body>
</html>
