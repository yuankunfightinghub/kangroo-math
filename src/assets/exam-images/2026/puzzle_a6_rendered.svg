<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 砖纹图案 -->
    <pattern id="brick-pattern" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect width="20" height="10" fill="#bbb" />
      <rect x="0" y="0" width="19" height="4.5" fill="#ccc" />
      <rect x="10" y="5" width="10" height="4.5" fill="#ccc" />
      <rect x="0" y="5" width="9" height="4.5" fill="#ccc" />
      <line x1="0" y1="0" x2="20" y2="0" stroke="#999" stroke-width="0.5" />
      <line x1="0" y1="5" x2="20" y2="5" stroke="#999" stroke-width="0.5" />
      <line x1="10" y1="5" x2="10" y2="10" stroke="#999" stroke-width="0.5" />
      <line x1="0" y1="0" x2="0" y2="5" stroke="#999" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- 背景网格（10列 x 3行，每格 40x40） -->
  <g fill="#f8f8f8" stroke="#777" stroke-width="1">
    <!-- 行1 -->
    <rect x="0" y="0" width="40" height="40" />
    <rect x="40" y="0" width="40" height="40" />
    <rect x="80" y="0" width="40" height="40" fill="url(#brick-pattern)" /> <!-- (1,3) -->
    <rect x="120" y="0" width="40" height="40" fill="url(#brick-pattern)" /> <!-- (1,4) -->
    <rect x="160" y="0" width="40" height="40" />
    <rect x="200" y="0" width="40" height="40" />
    <rect x="240" y="0" width="40" height="40" />
    <rect x="280" y="0" width="40" height="40" />
    <rect x="320" y="0" width="40" height="40" fill="url(#brick-pattern)" /> <!-- (1,9) -->
    <rect x="360" y="0" width="40" height="40" fill="url(#brick-pattern)" /> <!-- (1,10) -->

    <!-- 行2 -->
    <rect x="0" y="40" width="40" height="40" fill="url(#brick-pattern)" /> <!-- (2,1) -->
    <rect x="40" y="40" width="40" height="40" fill="url(#brick-pattern)" /> <!-- (2,2) -->
    <rect x="80" y="40" width="40" height="40" fill="url(#brick-pattern)" /> <!-- (2,3) -->
    <rect x="120" y="40" width="40" height="40" />
    <rect x="160" y="40" width="40" height="40" />
    <rect x="200" y="40" width="40" height="40" />
    <rect x="240" y="40" width="40" height="40" />
    <rect x="280" y="40" width="40" height="40" fill="url(#brick-pattern)" /> <!-- (2,8) -->
    <rect x="320" y="40" width="40" height="40" fill="url(#brick-pattern)" /> <!-- (2,9) -->
    <rect x="360" y="40" width="40" height="40" />

    <!-- 行3 -->
    <rect x="0" y="80" width="40" height="40" fill="url(#brick-pattern)" /> <!-- (3,1) -->
    <rect x="40" y="80" width="40" height="40" />
    <rect x="80" y="80" width="40" height="40" />
    <rect x="120" y="80" width="40" height="40" />
    <rect x="160" y="80" width="40" height="40" />
    <rect x="200" y="80" width="40" height="40" />
    <rect x="240" y="80" width="40" height="40" />
    <rect x="280" y="80" width="40" height="40" />
    <rect x="320" y="80" width="40" height="40" />
    <rect x="360" y="80" width="40" height="40" />
  </g>
</svg>
