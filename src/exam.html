<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历年真题 · 袋鼠数学乐园</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #030712; --card: rgba(255,255,255,0.03); --card-border: rgba(255,255,255,0.08);
  --text: #f8fafc; --muted: #94a3b8; --purple: #8b5cf6; --purple-light: #a78bfa;
  --blue: #3b82f6; --emerald: #10b981; --amber: #f59e0b; --pink: #ec4899;
}
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: 'Inter','Noto Sans SC',sans-serif; min-height: 100vh; overflow-x: hidden; }

/* Aurora */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.aurora-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.14; animation: auroraF linear infinite; }
.ab1 { width: 700px; height: 700px; background: radial-gradient(circle,#8b5cf6,transparent 70%); top: -200px; left: -100px; animation-duration: 22s; }
.ab2 { width: 600px; height: 600px; background: radial-gradient(circle,#06b6d4,transparent 70%); top: 100px; right: -150px; animation-duration: 28s; animation-delay:-10s; }
.ab3 { width: 500px; height: 500px; background: radial-gradient(circle,#ec4899,transparent 70%); bottom: 0; left: 30%; animation-duration: 20s; animation-delay:-5s; }
@keyframes auroraF { 0%{transform:translate(0,0)} 33%{transform:translate(35px,-28px)} 66%{transform:translate(-18px,38px)} 100%{transform:translate(0,0)} }
.dot-grid { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: radial-gradient(rgba(255,255,255,0.05) 1px,transparent 1px); background-size: 30px 30px; mask-image: radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%); }
.page { position: relative; z-index: 1; }

/* ── Sticky header ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 16px; padding: 14px 24px;
  background: rgba(3,7,18,0.88); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--card-border);
}
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: none;
  padding: 7px 14px; border: 1px solid var(--card-border); border-radius: 8px; transition: all 0.2s; white-space: nowrap;
}
.back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
.topbar-title { font-size: 16px; font-weight: 700; }

/* ── Search hero ── */
.search-hero { padding: 48px 24px 24px; text-align: center; max-width: 720px; margin: 0 auto; }
.search-hero h1 { font-size: clamp(28px,5vw,44px); font-weight: 900; letter-spacing: -0.03em; margin-bottom: 8px; }
.grad { background: linear-gradient(135deg,#a78bfa 0%,#60a5fa 50%,#34d399 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.search-desc { color: var(--muted); font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
.search-wrap { position: relative; max-width: 520px; margin: 0 auto 12px; }
.search-input {
  width: 100%; padding: 14px 50px 14px 20px;
  background: rgba(255,255,255,0.05); border: 1.5px solid var(--card-border); border-radius: 13px;
  color: var(--text); font-size: 16px; font-family: inherit; outline: none; transition: all 0.25s;
}
.search-input:focus { border-color: var(--purple); background: rgba(139,92,246,0.06); box-shadow: 0 0 0 3px rgba(139,92,246,0.12); }
.search-input::placeholder { color: var(--muted); }
.search-icon { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 17px; pointer-events: none; }
.hint-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.hint-chip {
  font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.04);
  border: 1px solid var(--card-border); border-radius: 999px; padding: 4px 12px;
  cursor: pointer; transition: all 0.2s;
}
.hint-chip:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.07); }

/* ── Filter bars ── */
.filter-section { max-width: 960px; margin: 0 auto; padding: 0 24px; }
.filter-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.pill-bar {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px;
  scrollbar-width: none;
}
.pill-bar::-webkit-scrollbar { display: none; }
/* Year pills */
.year-pill {
  flex-shrink: 0; padding: 6px 16px; border-radius: 999px;
  border: 1.5px solid var(--card-border); background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all 0.2s;
}
.year-pill:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.year-pill.active { background: rgba(139,92,246,0.15); border-color: rgba(139,92,246,0.45); color: var(--purple-light); }
/* Module pills */
.mod-pill {
  flex-shrink: 0; padding: 6px 14px; border-radius: 999px;
  border: 1.5px solid var(--card-border); background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.mod-pill:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.mod-pill.active { background: rgba(6,182,212,0.12); border-color: rgba(6,182,212,0.4); color: #67e8f9; }
.mod-pill .pill-cnt { font-size: 11px; opacity: 0.7; margin-left: 4px; }

/* ── Results info ── */
.results-info { padding: 0 24px 12px; max-width: 900px; margin: 0 auto; font-size: 13px; color: var(--muted); }

/* ── Question list ── */
.exam-list { max-width: 900px; margin: 0 auto; padding: 0 24px 100px; display: flex; flex-direction: column; gap: 20px; }

/* ── Question card ── */
.exam-card {
  background: var(--card); border: 1.5px solid var(--card-border);
  border-radius: 18px; overflow: hidden;
  animation: fadeUp 0.35s ease both; transition: border-color 0.2s;
}
.exam-card:hover { border-color: rgba(255,255,255,0.13); }
@keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }

/* Meta bar */
.exam-meta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 16px 20px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.meta-year {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  background: rgba(139,92,246,0.12); color: var(--purple-light); border: 1px solid rgba(139,92,246,0.3);
}
.meta-qnum {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  background: rgba(59,130,246,0.1); color: #93c5fd; border: 1px solid rgba(59,130,246,0.25);
}
.meta-diff {
  font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff;
}
.meta-mod {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #fff;
}
.meta-pts { font-size: 11px; color: var(--muted); margin-left: auto; }

/* Question image — the main content */
.exam-q-img-wrap {
  padding: 16px 20px 0;
  background: rgba(255,255,255,0.01);
}
.exam-q-img {
  display: block; width: 100%; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.07);
  background: #fff;  /* white bg so PDF screenshots look correct */
}
.no-img-placeholder {
  display: flex; align-items: center; justify-content: center;
  height: 80px; border-radius: 10px; border: 1px dashed rgba(255,255,255,0.12);
  color: var(--muted); font-size: 13px;
}

/* Answer buttons area */
.exam-answer { padding: 16px 20px 18px; }
.answer-label { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
.opt-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; border-radius: 12px; font-size: 15px; font-weight: 800;
  border: 1.5px solid var(--card-border); background: rgba(255,255,255,0.04);
  color: var(--text); cursor: pointer; transition: all 0.18s; font-family: inherit;
}
.opt-btn:hover:not(:disabled) { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.09); transform: translateY(-1px); }
.opt-btn.selected-correct { background: rgba(16,185,129,0.15); border-color: #10b981; color: #6ee7b7; }
.opt-btn.selected-wrong   { background: rgba(239,68,68,0.15);   border-color: #ef4444; color: #fca5a5; }
.opt-btn.reveal-correct   { background: rgba(16,185,129,0.08);  border-color: rgba(16,185,129,0.4); color: #6ee7b7; }
.opt-btn.dim              { opacity: 0.35; cursor: default; }
.opt-btn:disabled         { cursor: default; }

/* Feedback */
.exam-fb {
  margin-top: 12px; padding: 11px 15px; border-radius: 10px;
  font-size: 13px; line-height: 1.6; display: none;
}
.exam-fb.show { display: block; }
.exam-fb.ok { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2); color: #6ee7b7; }
.exam-fb.no { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); color: #fcd34d; }
.exam-fb.neutral { background: rgba(148,163,184,0.08); border: 1px solid rgba(148,163,184,0.15); color: var(--muted); }

/* No results */
.no-results { text-align: center; padding: 80px 24px; color: var(--muted); }
.no-results-icon { font-size: 52px; margin-bottom: 16px; }
.no-results-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 8px; }

/* ── Stats FAB ── */
.stats-fab {
  position: fixed; bottom: 28px; right: 24px; z-index: 200;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg,#8b5cf6,#3b82f6);
  border: none; cursor: pointer; font-size: 22px;
  box-shadow: 0 4px 20px rgba(139,92,246,0.45);
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.stats-fab:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(139,92,246,0.6); }
.stats-fab-badge {
  position: absolute; top: -4px; right: -4px;
  background: #ef4444; color: #fff; font-size: 11px; font-weight: 700;
  min-width: 20px; height: 20px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center; padding: 0 4px;
  border: 2px solid var(--bg);
}

/* ── Stats modal ── */
.stats-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center;
  padding: 0 0 0 0;
}
.stats-overlay.open { display: flex; }
.stats-panel {
  width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto;
  background: #0f172a; border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 24px 24px 0 0; padding: 28px 28px 40px;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:none;opacity:1} }
.stats-handle { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); margin: 0 auto 20px; }
.stats-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.stats-title { font-size: 18px; font-weight: 800; }
.stats-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 4px 8px; }
.stats-close:hover { color: var(--text); }

/* stat cards row */
.stat-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
.stat-card {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 14px 12px; text-align: center;
}
.stat-card-num { font-size: 28px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
.stat-card-lbl { font-size: 11px; color: var(--muted); font-weight: 600; }

/* section */
.stats-section { margin-bottom: 20px; }
.stats-section-title {
  font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.1em;
  text-transform: uppercase; margin-bottom: 10px;
}

/* diff rows */
.diff-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.diff-label { font-size: 13px; font-weight: 700; width: 36px; flex-shrink: 0; }
.diff-bar-wrap { flex: 1; height: 10px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
.diff-bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
.diff-pct { font-size: 12px; color: var(--muted); width: 36px; text-align: right; flex-shrink: 0; }
.diff-count { font-size: 11px; color: var(--muted); width: 56px; text-align: right; flex-shrink: 0; }

/* wrong list */
.wrong-list { display: flex; flex-direction: column; gap: 6px; }
.wrong-item {
  display: flex; align-items: center; gap: 8px;
  background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.15);
  border-radius: 10px; padding: 10px 14px; font-size: 13px;
}
.wrong-year-q { font-weight: 700; color: #fca5a5; white-space: nowrap; }
.wrong-diff { font-size: 11px; color: var(--muted); }
.wrong-ans { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }

/* module stat blocks */
.mod-stat-block {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
}
.mod-stat-hd {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.mod-stat-name { font-size: 13px; font-weight: 700; flex: 1; }
.mod-stat-pct { font-size: 16px; font-weight: 900; }
.mod-stat-cnt { font-size: 11px; color: var(--muted); width: 40px; text-align: right; }
.mod-stat-bars .diff-row { margin-bottom: 5px; }

/* qnum heatmap */
.qnum-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.qnum-cell {
  width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--muted);
}
.qnum-cell.qc-correct { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.35); color: #6ee7b7; }
.qnum-cell.qc-wrong   { background: rgba(239,68,68,0.15);   border-color: rgba(239,68,68,0.35);   color: #fca5a5; }
.qnum-cell.qc-none    { opacity: 0.4; }

/* export btn */
.export-btn {
  width: 100%; padding: 11px; border-radius: 12px; margin-top: 16px;
  background: rgba(139,92,246,0.12); border: 1.5px solid rgba(139,92,246,0.3);
  color: var(--purple-light); font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all 0.2s;
}
.export-btn:hover { background: rgba(139,92,246,0.2); }

/* clear btn */
.clear-btn {
  width: 100%; padding: 10px; border-radius: 12px; margin-top: 8px;
  background: rgba(239,68,68,0.07); border: 1.5px solid rgba(239,68,68,0.2);
  color: #fca5a5; font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all 0.2s;
}
.clear-btn:hover { background: rgba(239,68,68,0.14); }

/* empty state */
.stats-empty { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }

@media (max-width: 480px) {
  .stats-panel { padding: 22px 18px 36px; }
  .stat-cards { grid-template-columns: repeat(3,1fr); gap: 8px; }
  .stat-card-num { font-size: 22px; }
}

@media (max-width: 480px) {
  .opt-btn { width: 44px; height: 44px; font-size: 14px; }
  .exam-meta { padding: 12px 16px 10px; }
  .exam-q-img-wrap { padding: 12px 16px 0; }
  .exam-answer { padding: 12px 16px 16px; }
}
</style>
</head>
<body>
<div class="aurora">
  <div class="aurora-blob ab1"></div>
  <div class="aurora-blob ab2"></div>
  <div class="aurora-blob ab3"></div>
</div>
<div class="dot-grid"></div>
<div class="page">

<!-- Header -->
<header class="topbar">
  <a class="back-btn" href="../index.html">← 返回首页</a>
  <div class="topbar-title">📋 历年真题库</div>
</header>

<!-- Search hero -->
<div class="search-hero">
  <h1>历年<span class="grad">真题</span>库</h1>
  <p class="search-desc">2013—2025年 袋鼠数学竞赛 · 1-2年级原卷题目<br>输入「年份 题号」精准定位，例如 <strong>2018 5</strong> · <strong>2019 10</strong></p>
  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="text"
      placeholder="搜索：2018 5 · 2024 · 第3题 ..." autocomplete="off" inputmode="search">
    <span class="search-icon">🔍</span>
  </div>
  <div class="hint-row">
    <span class="hint-chip" onclick="quickSearch('2013')">2013年</span>
    <span class="hint-chip" onclick="quickSearch('2018 5')">2018·第5题</span>
    <span class="hint-chip" onclick="quickSearch('2019 10')">2019·第10题</span>
    <span class="hint-chip" onclick="quickSearch('2024 1')">2024·第1题</span>
    <span class="hint-chip" onclick="quickSearch('2025')">2025年</span>
  </div>
</div>

<!-- Year pills -->
<div class="filter-section">
  <div class="filter-label">按年份</div>
  <div class="pill-bar" id="yearBar"></div>
  <div class="filter-label" style="margin-top:4px">按模块</div>
  <div class="pill-bar" id="modBar"></div>
</div>

<!-- Results count -->
<div class="results-info" id="resultsInfo"></div>

<!-- Question list -->
<div class="exam-list" id="examList"></div>

</div>

<!-- Stats FAB -->
<button class="stats-fab" id="statsFab" onclick="openStats()" title="答题统计">
  📊
  <span class="stats-fab-badge" id="fabBadge" style="display:none"></span>
</button>

<!-- Stats modal -->
<div class="stats-overlay" id="statsOverlay" onclick="overlayClick(event)">
  <div class="stats-panel" id="statsPanel">
    <div class="stats-handle"></div>
    <div class="stats-header">
      <div class="stats-title">📊 答题统计 &amp; 分析</div>
      <button class="stats-close" onclick="closeStats()">✕</button>
    </div>
    <div id="statsContent"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  EXAM DATA  (auto-generated from official PDFs)
//
//  Fields:
//    year  — 年份
//    qnum  — 题号
//    d     — 难度 ★/★★/★★★  (3分/4分/5分)
//    dc    — 难度颜色
//    pts   — 分值
//    qimg  — 原题截图路径（包含题目文字+图+选项）
//    ans   — 正确答案 0-4 (A-E)，null 表示暂未收录
//    ok    — 答对反馈
//    no    — 答错反馈
// ════════════════════════════════════════════════════════════════
</script>
<script src="assets/exam-data.js"></script>
<script>
// ════════════════════════════════════════════════════════════════
//  Answer Log — localStorage persistence
//  Record format: { year, qnum, chosen, ans, pts, d, ts }
// ════════════════════════════════════════════════════════════════
const LOG_KEY = 'km_exam_log_v1';

function loadLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch { return []; }
}
function saveLog(log) {
  localStorage.setItem(LOG_KEY, JSON.stringify(log));
}

// Build answered map from log on startup
const answerLog = loadLog();  // array of records
const answered = {};          // key: "year-qnum" → chosen index (0-4)
answerLog.forEach(r => { answered[`${r.year}-${r.qnum}`] = r.chosen; });

// ── Module definitions ──
const MODULES = [
  { id: 0,  label: '未分类',        emoji: '❓', color: 'rgba(148,163,184,0.3)' },
  { id: 1,  label: '计数与数感',    emoji: '🔢', color: 'rgba(139,92,246,0.5)'  },
  { id: 2,  label: '几何图形',      emoji: '📐', color: 'rgba(59,130,246,0.5)'  },
  { id: 3,  label: '逻辑推理',      emoji: '🧩', color: 'rgba(16,185,129,0.5)'  },
  { id: 4,  label: '立体图形',      emoji: '🎲', color: 'rgba(245,158,11,0.5)'  },
  { id: 5,  label: '路径与方向',    emoji: '🗺️', color: 'rgba(6,182,212,0.5)'   },
  { id: 6,  label: '度量单位',      emoji: '📏', color: 'rgba(236,72,153,0.5)'  },
  { id: 7,  label: '数数策略',      emoji: '🌳', color: 'rgba(234,179,8,0.5)'   },
];

function getModuleLabel(mod) {
  const m = MODULES.find(x => x.id === mod);
  return m ? `${m.emoji} ${m.label}` : '❓ 未分类';
}

// ── State ──
// answered is declared above

// ── Search parsing ──
function parseSearch(s) {
  s = (s || '').trim();
  if (!s) return {};
  // "2018 5" / "2018-5" / "2018·5" / "2018，5"
  const m = s.match(/^(\d{4})[\s\-·,，、]+(\d+)$/);
  if (m) return { year: +m[1], qnum: +m[2] };
  // Year only "2024"
  if (/^\d{4}$/.test(s)) return { year: +s };
  // Question only "第5题" / "5"
  const qm = s.match(/^第?(\d{1,3})题?$/);
  if (qm) return { qnum: +qm[1] };
  return { text: s.toLowerCase() };
}

let activeYear = 'all';
let activeMod  = 'all';
let searchVal  = '';

function getFiltered() {
  const { year, qnum } = parseSearch(searchVal);
  const yearF = activeYear !== 'all' ? +activeYear : null;
  const modF  = activeMod  !== 'all' ? +activeMod  : null;
  return examData.filter(q => {
    if (yearF !== null && q.year !== yearF) return false;
    if (modF  !== null && (q.mod || 0) !== modF) return false;
    if (year  && q.year !== year) return false;
    if (qnum  && q.qnum !== qnum) return false;
    return true;
  });
}

// ── Year bar ──
function buildYearBar() {
  const years = [...new Set(examData.map(q => q.year))].sort((a,b) => b-a);
  document.getElementById('yearBar').innerHTML =
    [{ label:'全部', value:'all' }, ...years.map(y=>({ label: y+'年', value: String(y) }))]
    .map(p => `<button class="year-pill${activeYear===p.value?' active':''}" onclick="setYear('${p.value}')">${p.label}</button>`)
    .join('');
}

function setYear(val) {
  activeYear = val;
  activeMod = 'all';
  document.getElementById('searchInput').value = '';
  searchVal = '';
  buildYearBar();
  buildModBar();
  render();
}

// ── Module bar ──
function buildModBar() {
  // Count questions per module (respecting year filter)
  const yearF = activeYear !== 'all' ? +activeYear : null;
  const pool = yearF ? examData.filter(q => q.year === yearF) : examData;

  const counts = {};
  pool.forEach(q => { const k = q.mod || 0; counts[k] = (counts[k] || 0) + 1; });

  // Only show modules that have questions in current pool
  const allPill = `<button class="mod-pill${activeMod==='all'?' active':''}" onclick="setMod('all')">全部<span class="pill-cnt">${pool.length}</span></button>`;
  const modPills = MODULES
    .filter(m => counts[m.id])
    .map(m => `<button class="mod-pill${activeMod===String(m.id)?' active':''}" onclick="setMod('${m.id}')">${m.emoji} ${m.label}<span class="pill-cnt">${counts[m.id]||0}</span></button>`)
    .join('');

  document.getElementById('modBar').innerHTML = allPill + modPills;
}

function setMod(val) {
  activeMod = val;
  document.getElementById('searchInput').value = '';
  searchVal = '';
  buildModBar();
  render();
}

// ── Render ──
const OPTS = ['A','B','C','D','E'];

function renderCard(q, delay) {
  const key = `${q.year}-${q.qnum}`;
  const chosen = answered[key];
  const isDone = chosen !== undefined;

  // Image
  const imgHtml = q.qimg
    ? `<img class="exam-q-img" src="${q.qimg}" alt="${q.year}年第${q.qnum}题" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'no-img-placeholder\\'>图片加载中...</div>'">`
    : `<div class="no-img-placeholder">📄 图片整理中</div>`;

  // Option buttons
  const optHtml = OPTS.map((letter, i) => {
    let cls = 'opt-btn';
    if (isDone) {
      if (q.ans !== null) {
        if (i === q.ans && i === chosen) cls += ' selected-correct';
        else if (i === chosen && i !== q.ans) cls += ' selected-wrong';
        else if (i === q.ans) cls += ' reveal-correct';
        else cls += ' dim';
      } else {
        // Answer unknown — just show selected
        if (i === chosen) cls += ' selected-correct';
        else cls += ' dim';
      }
    }
    return `<button class="${cls}" ${isDone?'disabled':''} onclick="answer('${key}',${i})">${letter}</button>`;
  }).join('');

  // Feedback
  let fbHtml = '';
  if (isDone) {
    if (q.ans !== null) {
      const ok = chosen === q.ans;
      fbHtml = `<div class="exam-fb show ${ok?'ok':'no'}">${ok ? q.ok : q.no}</div>`;
    } else {
      fbHtml = `<div class="exam-fb show neutral">✅ 已记录！请对照上方原题图片核对答案。</div>`;
    }
  }

  const modInfo = MODULES.find(m => m.id === (q.mod || 0));
  const modTag = modInfo && modInfo.id !== 0
    ? `<span class="meta-mod" style="background:${modInfo.color}">${modInfo.emoji} ${modInfo.label}</span>`
    : '';
  return `<div class="exam-card" style="animation-delay:${Math.min(delay*0.04,0.6)}s">
    <div class="exam-meta">
      <span class="meta-year">${q.year}</span>
      <span class="meta-qnum">第 ${q.qnum} 题</span>
      <span class="meta-diff" style="background:${q.dc}">${q.d}</span>
      ${modTag}
      <span class="meta-pts">${q.pts}分题</span>
    </div>
    <div class="exam-q-img-wrap">${imgHtml}</div>
    <div class="exam-answer">
      <div class="answer-label">选择答案</div>
      <div class="opt-row">${optHtml}</div>
      ${fbHtml}
    </div>
  </div>`;
}

function render() {
  const filtered = getFiltered();
  const list = document.getElementById('examList');
  const info = document.getElementById('resultsInfo');

  if (!filtered.length) {
    list.innerHTML = `<div class="no-results">
      <div class="no-results-icon">🔍</div>
      <div class="no-results-title">未找到相关题目</div>
      <div style="font-size:14px;color:var(--muted)">试试 "2019 5" 或 "2024" 等格式</div>
    </div>`;
    info.textContent = '';
    return;
  }

  const isFiltered = searchVal.trim() || activeYear !== 'all';
  info.textContent = isFiltered ? `找到 ${filtered.length} 道题目` : `共收录 ${filtered.length} 道历年真题（2013—2025）`;
  list.innerHTML = filtered.map((q, i) => renderCard(q, i)).join('');
}

// ── Answer handler ──
function answer(key, chosen) {
  if (answered[key] !== undefined) return;
  answered[key] = chosen;

  // Parse key back to year+qnum
  const [yearStr, qnumStr] = key.split('-');
  const q = examData.find(x => x.year === +yearStr && x.qnum === +qnumStr);
  if (q) {
    const record = {
      year: q.year,
      qnum: q.qnum,
      module: getModuleLabel(q.mod || 0),
      chosen,           // 0-4
      chosenLetter: ['A','B','C','D','E'][chosen] || '?',
      ans: q.ans,       // correct answer index, null if unknown
      ansLetter: q.ans !== null ? ['A','B','C','D','E'][q.ans] : '?',
      correct: q.ans !== null ? (chosen === q.ans) : null,
      pts: q.pts,
      d: q.d,
      ts: Date.now()
    };
    answerLog.push(record);
    saveLog(answerLog);
    updateFabBadge();
  }

  render();
}

// ── Quick search ──
function quickSearch(val) {
  const input = document.getElementById('searchInput');
  input.value = val;
  searchVal = val;
  activeYear = 'all';
  buildYearBar();
  render();
}

// ── Search input ──
document.getElementById('searchInput').addEventListener('input', e => {
  searchVal = e.target.value;
  activeYear = 'all';
  buildYearBar();
  render();
});

// ── FAB badge ──
function updateFabBadge() {
  const badge = document.getElementById('fabBadge');
  const n = answerLog.length;
  if (n > 0) { badge.textContent = n; badge.style.display = 'flex'; }
  else { badge.style.display = 'none'; }
}

// ── Stats modal ──
function openStats() {
  document.getElementById('statsOverlay').classList.add('open');
  renderStats();
}
function closeStats() {
  document.getElementById('statsOverlay').classList.remove('open');
}
function overlayClick(e) {
  if (e.target === document.getElementById('statsOverlay')) closeStats();
}

function renderStats() {
  const el = document.getElementById('statsContent');
  if (!answerLog.length) {
    el.innerHTML = `<div class="stats-empty">还没有作答记录<br><span style="font-size:12px">点击题目选项开始答题，系统自动记录</span></div>`;
    return;
  }

  const known = answerLog.filter(r => r.ans !== null);
  const total = known.length;
  const correct = known.filter(r => r.correct).length;
  const wrong = known.filter(r => !r.correct);
  const pct = total ? Math.round(correct / total * 100) : 0;

  // ── 各难度正确率 ──
  const diffMap = {};
  known.forEach(r => {
    if (!diffMap[r.d]) diffMap[r.d] = { total:0, correct:0 };
    diffMap[r.d].total++;
    if (r.correct) diffMap[r.d].correct++;
  });
  const diffColor = { '★':'#10b981', '★★':'#f59e0b', '★★★':'#ec4899' };
  const diffRows = ['★','★★','★★★'].filter(d => diffMap[d]).map(d => {
    const m = diffMap[d]; const p = Math.round(m.correct/m.total*100);
    return `<div class="diff-row">
      <span class="diff-label" style="color:${diffColor[d]}">${d}</span>
      <div class="diff-bar-wrap"><div class="diff-bar-fill" style="width:${p}%;background:${diffColor[d]}"></div></div>
      <span class="diff-pct">${p}%</span>
      <span class="diff-count">${m.correct}/${m.total}</span>
    </div>`;
  }).join('');

  // ── 按模块分类统计（各难度正确率）──
  // 需要从 examData 查找每条记录的 mod
  const qKeyToMod = {};
  examData.forEach(q => { qKeyToMod[`${q.year}-${q.qnum}`] = q.mod || 0; });

  // modStats[modId][diff] = {total, correct}
  const modStats = {};
  known.forEach(r => {
    const modId = qKeyToMod[`${r.year}-${r.qnum}`] ?? 0;
    if (!modStats[modId]) modStats[modId] = {};
    if (!modStats[modId][r.d]) modStats[modId][r.d] = { total:0, correct:0 };
    modStats[modId][r.d].total++;
    if (r.correct) modStats[modId][r.d].correct++;
  });

  const modRows = Object.entries(modStats)
    .sort((a,b) => +a[0] - +b[0])
    .map(([modId, diffs]) => {
      const mod = MODULES.find(m => m.id === +modId) || MODULES[0];
      const totalM = Object.values(diffs).reduce((s,v)=>s+v.total, 0);
      const correctM = Object.values(diffs).reduce((s,v)=>s+v.correct, 0);
      const pctM = Math.round(correctM/totalM*100);
      const diffBars = ['★','★★','★★★'].filter(d => diffs[d]).map(d => {
        const v = diffs[d]; const p = Math.round(v.correct/v.total*100);
        return `<div class="diff-row" style="margin-bottom:5px">
          <span class="diff-label" style="color:${diffColor[d]};font-size:11px">${d}</span>
          <div class="diff-bar-wrap"><div class="diff-bar-fill" style="width:${p}%;background:${diffColor[d]}"></div></div>
          <span class="diff-pct">${p}%</span>
          <span class="diff-count">${v.correct}/${v.total}</span>
        </div>`;
      }).join('');
      const totalInDB = examData.filter(q => (q.mod||0) === +modId).length;
      return `<div class="mod-stat-block">
        <div class="mod-stat-hd">
          <span class="mod-stat-name">${mod.emoji} ${mod.label}</span>
          <span style="font-size:11px;color:var(--muted)">共${totalInDB}题</span>
          <span class="mod-stat-pct" style="color:${pctM>=80?'#34d399':pctM>=60?'#f59e0b':'#f87171'}">${pctM}%</span>
          <span class="mod-stat-cnt">${correctM}/${totalM}已答</span>
        </div>
        <div class="mod-stat-bars">${diffBars}</div>
      </div>`;
    }).join('');

  // ── 题号热力图 ──
  const qnumStats = {};
  known.forEach(r => {
    if (!qnumStats[r.qnum]) qnumStats[r.qnum] = {correct:0, wrong:0};
    r.correct ? qnumStats[r.qnum].correct++ : qnumStats[r.qnum].wrong++;
  });
  const heatCells = Array.from({length:20},(_,i)=>i+1).map(n => {
    const s = qnumStats[n];
    if (!s) return `<div class="qnum-cell qc-none">${n}</div>`;
    const cls = s.wrong > s.correct ? 'qc-wrong' : 'qc-correct';
    return `<div class="qnum-cell ${cls}" title="第${n}题: 答对${s.correct}次, 答错${s.wrong}次">${n}</div>`;
  }).join('');

  // ── 高频错题 ──
  const wrongQnums = Object.entries(qnumStats)
    .filter(([,v]) => v.wrong > 0)
    .sort((a,b) => b[1].wrong - a[1].wrong)
    .map(([q,v]) => ({ qnum:+q, wrongCount:v.wrong, total:v.correct+v.wrong }));
  const topWrong = wrongQnums.slice(0,5).map(w =>
    `第<strong>${w.qnum}</strong>题（错${w.wrongCount}/${w.total}次）`
  ).join('、') || '暂无';

  // ── 错题记录 ──
  const OPTS_LETTERS = ['A','B','C','D','E'];
  const wrongItems = wrong.slice(-20).reverse().map(r => {
    const modId = qKeyToMod[`${r.year}-${r.qnum}`] ?? 0;
    const mod = MODULES.find(m => m.id === modId) || MODULES[0];
    return `<div class="wrong-item">
      <span class="wrong-year-q">${r.year} · 第${r.qnum}题</span>
      <span class="wrong-diff" style="color:${diffColor[r.d]||'var(--muted)'}">${r.d}</span>
      <span style="font-size:11px;color:var(--muted)">${mod.emoji} ${mod.label}</span>
      <span class="wrong-ans">选了 ${r.chosenLetter} · 答案 ${r.ansLetter}</span>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-card-num" style="color:#a78bfa">${answerLog.length}</div>
        <div class="stat-card-lbl">已作答</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-num" style="color:#34d399">${pct}%</div>
        <div class="stat-card-lbl">正确率</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-num" style="color:#f87171">${wrong.length}</div>
        <div class="stat-card-lbl">答错题数</div>
      </div>
    </div>

    <div class="stats-section">
      <div class="stats-section-title">各难度正确率</div>
      ${diffRows || '<div style="color:var(--muted);font-size:13px">暂无数据</div>'}
    </div>

    <div class="stats-section">
      <div class="stats-section-title">模块分类统计</div>
      ${modRows || '<div style="color:var(--muted);font-size:13px">暂无数据</div>'}
    </div>

    <div class="stats-section">
      <div class="stats-section-title">题号热力图（绿=多对 · 红=多错）</div>
      <div class="qnum-grid">${heatCells}</div>
    </div>

    ${wrongQnums.length ? `
    <div class="stats-section">
      <div class="stats-section-title">高频错题分析</div>
      <div style="font-size:13px;line-height:1.8;color:var(--muted)">
        错误最多的题号：${topWrong}<br>
        建议重点复习对应知识点。
      </div>
    </div>` : ''}

    ${wrong.length ? `
    <div class="stats-section">
      <div class="stats-section-title wrong-toggle" onclick="toggleWrongList(this)" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none">
        <span>错题记录（共 ${wrong.length} 条）</span>
        <span class="wrong-toggle-arr" style="font-size:12px;transition:transform .25s">▶</span>
      </div>
      <div class="wrong-list" id="wrongListBody" style="display:none">${wrongItems}</div>
    </div>` : ''}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px">
      <button class="export-btn" style="margin-top:0" onclick="exportLog()">💾 导出保存到文件</button>
      <button class="export-btn" style="margin-top:0;background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.3);color:#93c5fd" onclick="importLog()">📂 导入本地文件</button>
    </div>
    <button class="clear-btn" onclick="clearLog()">🗑 清空记录</button>
  `;
}

function toggleWrongList(titleEl) {
  const body = document.getElementById('wrongListBody');
  const arr = titleEl.querySelector('.wrong-toggle-arr');
  const isHidden = body.style.display === 'none';
  body.style.display = isHidden ? 'flex' : 'none';
  arr.style.transform = isHidden ? 'rotate(90deg)' : '';
}

function exportLog() {
  // 固定文件名，方便下次导入时快速找到
  const blob = new Blob([JSON.stringify(answerLog, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'kangroo_exam_log.json'; a.click();
  URL.revokeObjectURL(url);
}

function importLog() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      let imported;
      try { imported = JSON.parse(ev.target.result); } catch {
        alert('文件格式错误，请选择之前导出的 kangroo_exam_log.json');
        return;
      }
      if (!Array.isArray(imported)) {
        alert('文件内容不是有效的答题记录数组');
        return;
      }
      // 合并：以 year+qnum+ts 三者联合去重
      const existingKeys = new Set(answerLog.map(r => `${r.year}-${r.qnum}-${r.ts}`));
      let added = 0;
      imported.forEach(r => {
        const k = `${r.year}-${r.qnum}-${r.ts}`;
        if (!existingKeys.has(k)) {
          answerLog.push(r);
          existingKeys.add(k);
          added++;
        }
      });
      // 按时间排序保持有序
      answerLog.sort((a, b) => (a.ts || 0) - (b.ts || 0));
      // 同步 answered map（以最新一次作答为准）
      answerLog.forEach(r => { answered[`${r.year}-${r.qnum}`] = r.chosen; });
      saveLog(answerLog);
      updateFabBadge();
      render();
      renderStats();
      const msg = added > 0
        ? `导入成功！合并了 ${added} 条新记录，当前共 ${answerLog.length} 条。`
        : `文件中的记录已全部存在，无新增（共 ${answerLog.length} 条）。`;
      alert(msg);
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearLog() {
  if (!confirm('确定清空所有答题记录？此操作不可撤销。')) return;
  answerLog.length = 0;
  saveLog(answerLog);
  Object.keys(answered).forEach(k => delete answered[k]);
  updateFabBadge();
  render();
  renderStats();
}

// ── Init ──
buildYearBar();
buildModBar();
render();
updateFabBadge();
</script>
